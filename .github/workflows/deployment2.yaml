name : Deployment Exercise 2
on: push
jobs: 
 lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install Dependencies
        run: npm ci 
      - name: Lint
        run: npm run lint
 test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
     - name: Get Code
       uses: actions/checkout@v3
     - name: Install Dependencies
       run: npm ci 
     - name: Test code
       run: npm run test
 build: 
    needs: test
    runs-on: ubuntu-latest
    steps:
     - name: Get Code
       uses: actions/checkout@v3
     - name: Install Dependencies
       run: npm ci 
     - name: Build website
       run: npm run build  
     - name: Upload artifacts 
     - uses: actions/upload-artifact@v4
       with:
        name: my-artifact
        path: | 
          dist
          package.json
 deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
     - name: Get Code
       uses: actions/checkout@v3
     - name: Install Dependencies
       run: npm ci 
     - name: Build code
       run: npm run build  
     - name: Deploy code 
       run: echo "Deploying ..." 


